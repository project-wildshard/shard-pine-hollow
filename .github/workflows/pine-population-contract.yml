name: pine-population-contract

# Build with the declared producer pins, then play those immutable bytes
# against the exact runtime repair. The normal ci workflow keeps its pins.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: Exact final engine repair commit
        type: string
        default: ''
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    # New tests report for a week before admission as blocking gates.
    continue-on-error: true
    timeout-minutes: 15
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      PINE_JOURNEY_DIR: tmp/pine-population-contract
      PINE_ENGINE_CANDIDATE: ${{ inputs.engine || '1b69ff06d751081999d2ece7fa1aafea4e98c312' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Install the declared producer graph
        run: pnpm install --frozen-lockfile --config.ci=false
      - name: Record the actual pinned producer
        run: node scripts/assert-candidate-engine.mjs --producer
      - name: Build actual authored Pine products
        run: pnpm build:shards
      - name: Select the exact runtime repair
        env:
          CANDIDATE_ENGINE: ${{ env.PINE_ENGINE_CANDIDATE }}
        run: node scripts/select-candidate.mjs
      - name: Install the candidate runtime graph
        run: |
          pnpm install --no-frozen-lockfile --config.ci=false
          node scripts/candidate-format.mjs
      - name: Resolve the candidate's exact format and wire
        run: pnpm install --no-frozen-lockfile --config.ci=false
      - name: Verify the actual installed immutable engine
        id: runtime
        run: node scripts/assert-candidate-engine.mjs
      - name: Check installed exports and the cleared queue
        run: node scripts/check-test-boundary.mjs
      - name: Earn every lantern, the stag, King, dawn and reward
        run: node --test test/ci/warden-journey.test.mjs
      - name: Survive natural rain for 60000 inputs and restore exactly
        if: always() && steps.runtime.outcome == 'success'
        run: node --test test/ci/population-journey.test.mjs
      - name: Retain actual journey receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pine-population-contract
          path: tmp/pine-population-contract/*.json
          if-no-files-found: error
          retention-days: 14
